<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Requests — CrabKing's Lair</title>
  <meta name="description" content="View artwork requests submitted to CrabKing's Lair.">
  <meta name="theme-color" content="#060b14">

  <link rel="stylesheet" href="style.css">
</head>
<body class="page-panel">

  <header class="site-header">
    <div class="container header-inner">

      <div class="header-brand">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 4v3"></path>
              <circle cx="12" cy="10" r="5"></circle>
              <path d="M4 8l3 2M20 8l-3 2M4 14l3-1M20 14l-3-1M7 19l2-3M17 19l-2-3"></path>
            </svg>
          </span>
          <span class="brand-text">CrabKing's <em>Lair</em></span>
        </a>

        <p class="header-contact">
          <a href="mailto:poundmatt@live.com">Email: poundmatt@live.com</a>
          <a href="tel:+447426252575">Phone: 07426 252575</a>
        </p>
      </div>

      <button class="nav-toggle" type="button"
              aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <ul class="nav-list">
          <li><a href="artwork-request.html">Artwork Request</a></li>
          <li><a href="just-for-fun.html">Just for Fun</a></li>
          <li><a href="buy-token.html">Buy a Token</a></li>
          <li><a href="payment.html">Payment</a></li>
          <li><a href="view-requests.html" aria-current="page">View Requests</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <main id="main" class="page-main">
    <div class="container page-head">
      <h1>View Requests</h1>
      <p class="page-note">
        This area is protected. Enter the password to view submitted requests.
      </p>

      <form class="access-form" id="requests-access-form">
        <label class="sr-only" for="requests-password">Password</label>
        <input class="search-input" id="requests-password" name="password" type="password"
               placeholder="Enter password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">View Requests</button>
      </form>

      <p class="page-note" id="requests-status" role="status" aria-live="polite"></p>

      <ul class="requests-grid" id="requests-grid"></ul>
    </div>
  </main>

  <script>
    // Mobile navigation
    const toggle = document.querySelector('.nav-toggle');
    const header = document.querySelector('.site-header');

    toggle.addEventListener('click', () => {
      const open = header.classList.toggle('nav-open');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
    });

    document.querySelectorAll('#site-nav a').forEach((link) => {
      link.addEventListener('click', () => {
        header.classList.remove('nav-open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });

    // Read-only grid of submitted requests
    const grid = document.getElementById('requests-grid');
    const status = document.getElementById('requests-status');
    const accessForm = document.getElementById('requests-access-form');
    const passwordInput = document.getElementById('requests-password');
    const submitBtn = accessForm.querySelector('button[type="submit"]');

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[char]));
    }

    function formatDate(value) {
      const date = new Date(value);
      if (isNaN(date)) return '';
      return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function render(rows) {
      if (!rows.length) {
        status.textContent = 'No requests yet.';
        return;
      }

      status.textContent = rows.length === 1 ? '1 request' : rows.length + ' requests';

      grid.innerHTML = rows.map((row) => `
        <li class="request-card">
          <h2>${escapeHtml(row.card_name)}</h2>
          <dl>
            <div>
              <dt>My name</dt>
              <dd>${escapeHtml(row.name)}</dd>
            </div>
            <div>
              <dt>Artwork type</dt>
              <dd>${escapeHtml(row.artwork_type)}</dd>
            </div>
            <div>
              <dt>Notes</dt>
              <dd>${escapeHtml(row.notes || '')}</dd>
            </div>
            <div>
              <dt>Submitted</dt>
              <dd>${formatDate(row.created_at)}</dd>
            </div>
          </dl>
        </li>
      `).join('');
    }

    accessForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = passwordInput.value.trim();
      grid.innerHTML = '';

      if (!password) {
        status.textContent = 'Please enter the password.';
        return;
      }

      submitBtn.disabled = true;
      status.textContent = 'Checking password…';

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password }),
        });

        if (response.status === 401) {
          status.textContent = 'Access denied.';
          return;
        }

        if (response.status === 404) {
          status.textContent = 'Protected API is not available in this preview yet.';
          return;
        }

        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || 'Could not load requests.');
        }

        render(payload.data || []);
      } catch (error) {
        console.error(error);
        status.textContent = 'Could not load requests.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
