<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Showcase Studio - Audio Walkthrough</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .slideshow-container {
      max-width: 950px;
      width: 100%;
      position: relative;
      margin: 0 auto;
    }

    .slide {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .slide.active {
      display: block;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-content-layout {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .slide-content-layout {
        flex-direction: row;
        align-items: flex-start;
      }
      .slide-text-side {
        flex: 1.1;
      }
      .slide-image-side {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }

    /* Larger Image & Script Underneath Layout */
    .slide-image {
      width: 100%;
      max-height: 480px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      object-fit: contain;
      background-color: #020617;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    .script-box-under-image {
      background-color: rgba(15, 23, 42, 0.7);
      border-left: 3px solid var(--accent-color);
      padding: 0.85rem 1rem;
      border-radius: 0 6px 6px 0;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-style: italic;
      margin-top: 1rem;
      width: 100%;
    }

    .script-box-under-image strong {
      font-style: normal;
      color: var(--accent-color);
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent-color);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .app-title-group h2 {
      font-size: 1.75rem;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    .app-description {
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    /* Navigation & Control Buttons Bar */
    .controls-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-control {
      background-color: var(--border-color);
      color: var(--text-color);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-control:hover {
      background-color: var(--accent-color);
      color: #0f172a;
    }

    .dots-wrapper {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }

    .dot {
      height: 7px;
      width: 7px;
      background-color: var(--border-color);
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: var(--accent-color);
      width: 18px;
      border-radius: 4px;
    }

    /* Start Overlay Banner */
    .start-overlay {
      text-align: center;
      padding: 4rem 2rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .start-overlay h2 {
      font-size: 2rem;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .start-overlay p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .btn-start {
      background-color: var(--accent-color);
      color: #0f172a;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-start:hover {
      opacity: 0.9;
    }

    .loading-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.1rem;
      padding: 3rem;
    }
  </style>
</head>
<body>

  <div class="slideshow-container" id="slideshow-container">
    
    <!-- Initial Start Overlay -->
    <div id="start-overlay" class="start-overlay">
      <h2>UnderCroft Audio Walkthrough</h2>
      <p>Click below to start the interactive presentation with voice narration.</p>
      <button class="btn-start" onclick="startWalkthrough()">▶ Start Presentation & Audio</button>
    </div>

    <div id="slides-wrapper" style="display: none;">
      <!-- Slides injected here -->
    </div>

    <!-- Controls Bar (Previous, Pause/Play, Next) -->
    <div id="controls-bar" class="controls-bar" style="display: none;">
      <button class="btn-control" onclick="prevSlide()">◀ Previous</button>
      <button id="btn-pause-play" class="btn-control" onclick="togglePausePlay()">⏸ Pause</button>
      <button class="btn-control" onclick="nextSlideManual()">Next ▶</button>
    </div>

    <!-- Dot Indicators -->
    <div class="dots-wrapper" id="dots-wrapper" style="display: none;"></div>
  </div>

  <script>
    let currentSlide = 0;
    let autoPlayTimer = null;
    let appData = [];
    let isPlaying = false;

    async function loadWalkthroughData() {
      try {
        const response = await fetch('app_walkthrough_project_v1.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        appData = await response.json();
        
        if (!Array.isArray(appData)) {
          appData = appData.apps || appData.slides || appData.steps || Object.values(appData)[0];
        }

        buildSlides();
      } catch (error) {
        console.error('Failed to load walkthrough JSON:', error);
        document.getElementById('start-overlay').innerHTML = `
          <h2 style="color: #f87171;">Error Loading Dataset</h2>
          <p style="color: var(--text-muted);">Could not load <strong>app_walkthrough_project_v1.json</strong> from the server.</p>
        `;
      }
    }

    function buildSlides() {
      const slidesWrapper = document.getElementById('slides-wrapper');
      const dotsWrapper = document.getElementById('dots-wrapper');

      slidesWrapper.innerHTML = '';
      dotsWrapper.innerHTML = '';

      if (!appData || appData.length === 0) return;

      appData.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `slide ${index === 0 ? 'active' : ''}`;
        
        const title = item.title || `Step ${index + 1}`;
        const category = item.category || '';
        const description = item.description || '';
        const script = item.script || '';
        const imgSrc = item.image || '';

        slide.innerHTML = `
          <div class="slide-content-layout">
            <div class="slide-text-side">
              ${category ? `<span class="category-badge">${category}</span>` : ''}
              <div class="app-title-group">
                <h2>${title}</h2>
              </div>
              <p class="app-description">${description}</p>
            </div>
            <div class="slide-image-side">
              ${imgSrc ? `<img src="${imgSrc}" alt="${title}" class="slide-image">` : ''}
              ${script ? `
                <div class="script-box-under-image">
                  <strong>Narration Script</strong>
                  "${script}"
                </div>
              ` : ''}
            </div>
          </div>
        `;
        slidesWrapper.appendChild(slide);

        const dot = document.createElement('span');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.addEventListener('click', () => goToSlide(index));
        dotsWrapper.appendChild(dot);
      });
    }

    function startWalkthrough() {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('slides-wrapper').style.display = 'block';
      document.getElementById('controls-bar').style.display = 'flex';
      document.getElementById('dots-wrapper').style.display = 'flex';
      
      isPlaying = true;
      playCurrentSlideAudioAndAdvance();
    }

    function showSlide(index) {
      const slides = document.querySelectorAll('.slide');
      const dots = document.querySelectorAll('.dot');

      if (slides.length === 0) return;

      if (index >= slides.length) currentSlide = 0;
      else if (index < 0) currentSlide = slides.length - 1;
      else currentSlide = index;

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
    }

    function playCurrentSlideAudioAndAdvance() {
      window.speechSynthesis.cancel();
      if (!isPlaying) return;

      const currentItem = appData[currentSlide];
      const textToSpeak = currentItem?.script || currentItem?.description || currentItem?.title || '';

      showSlide(currentSlide);

      if (textToSpeak && 'speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.rate = 1.0;

        utterance.onend = () => {
          if (isPlaying) {
            currentSlide = (currentSlide + 1) % appData.length;
            playCurrentSlideAudioAndAdvance();
          }
        };

        utterance.onerror = () => {
          fallbackTimer();
        };

        window.speechSynthesis.speak(utterance);
      } else {
        fallbackTimer();
      }
    }

    function fallbackTimer() {
      clearTimeout(autoPlayTimer);
      autoPlayTimer = setTimeout(() => {
        if (isPlaying) {
          currentSlide = (currentSlide + 1) % appData.length;
          playCurrentSlideAudioAndAdvance();
        }
      }, 6000);
    }

    function goToSlide(index) {
      window.speechSynthesis.cancel();
      clearTimeout(autoPlayTimer);
      currentSlide = index;
      if (isPlaying) {
        playCurrentSlideAudioAndAdvance();
      } else {
        showSlide(currentSlide);
      }
    }

    function nextSlideManual() {
      window.speechSynthesis.cancel();
      clearTimeout(autoPlayTimer);
      currentSlide = (currentSlide + 1) % appData.length;
      if (isPlaying) {
        playCurrentSlideAudioAndAdvance();
      } else {
        showSlide(currentSlide);
      }
    }

    function prevSlide() {
      window.speechSynthesis.cancel();
      clearTimeout(autoPlayTimer);
      currentSlide = (currentSlide - 1 + appData.length) % appData.length;
      if (isPlaying) {
        playCurrentSlideAudioAndAdvance();
      } else {
        showSlide(currentSlide);
      }
    }

    function togglePausePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-pause-play');
      if (isPlaying) {
        btn.textContent = '⏸ Pause';
        playCurrentSlideAudioAndAdvance();
      } else {
        btn.textContent = '▶ Play';
        window.speechSynthesis.cancel();
        clearTimeout(autoPlayTimer);
      }
    }

    document.addEventListener('DOMContentLoaded', loadWalkthroughData);
  </script>
</body>
</html>
